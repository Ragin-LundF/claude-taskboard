    $('#stats').innerHTML = `<span><b>${open.length}</b> open</span><span><b>${workers.size}</b> working</span><span><b>${tasks.length - open.length}</b> finished</span>`;
    const archived = state.tasks.filter((t) => t.archived && (projectFilter === '__all' || t.project === projectFilter));
    $('#archiveBtn').textContent = `Archive (${archived.length})`;
    renderDrawer(archived);
    renderQuestions();
    renderUsage();
    renderLimits();
  }

  function renderDrawer(archived) {
    const list = archived.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
    $('#drawerBody').innerHTML = list.length ? list.map((t) => `<div class="arch"><span class="tid">${esc(t.id)}</span><span class="t" title="${esc(t.title)}">${esc(t.title)}</span><button class="btn sm" data-restore="${esc(t.id)}">Restore</button></div>`).join('')
      : '<div class="empty">Nothing removed yet</div>';
  }

  // ---------------------------------------------------------------- events
  $('#project').addEventListener('change', (e) => {
    projectFilter = e.target.value; store.set('project', projectFilter);
    checked.clear();
    const u = new URL(location.href);
    if (projectFilter === '__all') u.searchParams.delete('project'); else u.searchParams.set('project', projectFilter);
    history.replaceState(null, '', u);
    render();
  });
  $('#search').addEventListener('input', (e) => { search = e.target.value; render(); });
  $('#archiveBtn').addEventListener('click', () => { $('#qdrawer').classList.remove('open'); $('#drawer').classList.toggle('open'); });
  $('#closeDrawer').addEventListener('click', () => $('#drawer').classList.remove('open'));
  $('#drawerBody').addEventListener('click', (e) => {
    const id = e.target.dataset.restore;
    if (id) op('unarchive', { ids: [id] }).catch(alertError);
  });

  $('#board').addEventListener('click', (e) => {
    const t = e.target;
    if (t.dataset.check) {
      t.checked ? checked.add(t.dataset.check) : checked.delete(t.dataset.check);
      render(); return;
    }
    if (t.dataset.desc) { openDesc.has(t.dataset.desc) ? openDesc.delete(t.dataset.desc) : openDesc.add(t.dataset.desc); render(); return; }
    if (t.dataset.del) {
      if (confirmDelete === t.dataset.del) { confirmDelete = null; op('remove', { id: t.dataset.del }).catch(alertError); }
      else { confirmDelete = t.dataset.del; render(); setTimeout(() => { if (confirmDelete === t.dataset.del) { confirmDelete = null; render(); } }, 3000); }
      return;
    }
    if (t.dataset.openq) { $('#drawer').classList.remove('open'); $('#qdrawer').classList.add('open'); const ta = $('#qbody').querySelector(`[data-qtext="${CSS.escape(t.dataset.openq)}"]`); if (ta) ta.focus(); return; }
    if (t.id === 'addBtn') { addOpen = !addOpen; focusAdd = addOpen; render(); return; }
    if (t.id === 'checkAll') {
      const done = visibleTasks().filter((x) => x.status === 'done');
      const allOn = done.every((x) => checked.has(x.id));
      done.forEach((x) => (allOn ? checked.delete(x.id) : checked.add(x.id)));
      render(); return;
    }
    if (t.id === 'removeChecked' && checked.size) {
      const ids = [...checked]; checked.clear();
      op('archive', { ids }).catch(alertError);
    }
  });

  $('#board').addEventListener('keydown', (e) => {
    if (e.target.id !== 'addInput') return;
    if (e.key === 'Escape') { addOpen = false; render(); return; }
    if (e.key !== 'Enter') return;
    const title = e.target.value.trim();
    if (!title || projectFilter === '__all') return;
    e.target.value = '';
    op('add', { project: projectFilter, title, source: 'ui' }).catch(alertError);
  });

  // drag & drop between columns
  $('#board').addEventListener('dragstart', (e) => {
    const card = e.target.closest && e.target.closest('.card');
    if (!card) return;
    dragId = card.dataset.id; card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
  });
  $('#board').addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.drop').forEach((el) => el.classList.remove('dragging', 'drop')); if (renderPending) { renderPending = false; render(); } });
  $('#board').addEventListener('dragover', (e) => {
    const col = e.target.closest && e.target.closest('.col');
    if (!col || !dragId) return;
    e.preventDefault();
    document.querySelectorAll('.col.drop').forEach((el) => el !== col && el.classList.remove('drop'));
    col.classList.add('drop');
  });
  $('#board').addEventListener('drop', (e) => {
    const col = e.target.closest && e.target.closest('.col');
    if (!col || !dragId) return;
    e.preventDefault();
    const id = dragId; const status = col.dataset.status;
    const task = state.tasks.find((t) => t.id === id);
    if (task && task.status !== status) op('update', { id, status }).catch(alertError);
  });

  function toast(text, kind = 'ok', ms = 4500) {
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = text;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);
  }
  function alertError(err) { console.error(err); toast(err.message || String(err), 'err', 7000); }

  /** Toasts for question changes made elsewhere (agent picked an answer up, new question arrived). */
  function questionTransitions(next) {
    if (prevQuestions) {
      for (const q of next) {
        const before = prevQuestions[q.id];
        if (!before && q.status === 'open') toast(`New question ${q.id}${q.askedBy ? ` from ${q.askedBy}` : ''}: ${q.question.slice(0, 90)}`, 'info', 6000);
        else if (before && !before.delivered && q.delivered && q.status !== 'open') toast(`✓ ${q.id}${q.externalId ? ` [${q.externalId}]` : ''} received by ${q.askedBy || 'the agent'}`, 'ok', 6000);
      }
    }
    prevQuestions = Object.fromEntries(next.map((q) => [q.id, { delivered: q.delivered, status: q.status }]));
  }

  function renderBanner() {
    const b = $('#banner');
    const sv = state.serverVersion;
    const v = $('#ver');
    v.textContent = `v${sv || UI_VERSION}`;
    v.classList.toggle('mismatch', !!sv && sv !== UI_VERSION);
    v.title = sv === UI_VERSION ? `Taskboard v${sv}` : `Board server v${sv || '?'} · page v${UI_VERSION}`;
    if (sv === UI_VERSION) { b.classList.remove('show'); return; }
    b.innerHTML = `<b>Version mismatch:</b>&nbsp;the board server runs ${sv ? 'v' + esc(sv) : 'an older version'}, this page is v${UI_VERSION}. Answers and buttons may not work. Restart your Claude sessions (or quit the oldest one); sessions with v1.6+ take the board over automatically from now on.`;
    b.classList.add('show');
  }

  // ---------------------------------------------------------------- live updates
  function setConn(live, text) {
    $('#conn').classList.toggle('live', live);
    $('#conn span').textContent = text || (live ? 'live' : 'reconnecting…');
    $('#conn').title = live ? 'Live: updates appear instantly' : (text || 'Reconnecting to the board…');
  }
  function connectState() {
    const es = new EventSource('/api/events');
    es.addEventListener('state', (e) => { state = JSON.parse(e.data); state.questions = state.questions || []; questionTransitions(state.questions); setConn(true); renderBanner(); render(); });
    es.addEventListener('usage', (e) => { usage = JSON.parse(e.data); renderUsage(); });
    es.onopen = () => setConn(true);
    es.onerror = () => setConn(false); // EventSource retries on its own; a new leader picks up within ~2s
    connectState.es && connectState.es.close();
    connectState.es = es;
  }
  setInterval(() => document.querySelectorAll('.time').length && !dragId && render(), 60000);
  setInterval(renderLimits, 20000);
  connectState();
})();
</script>
</body>
</html>
